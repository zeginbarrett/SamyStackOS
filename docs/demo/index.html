<style>
:root{color-scheme:dark;--bg:#111314;--header:#1a1b1d;--side:#191b1c;--panel:#222425;--outline:#343738;--muted:#a0adbf;--orange:#e48424;--green:#55d68d;--text:#edf0f3;--red:#f57575}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:12px/1.45 Arial,Helvetica,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
header{height:62px;position:sticky;top:0;z-index:20;background:linear-gradient(#1b1d1e,#191a1b);border-bottom:1px solid #bd6c22;display:flex;align-items:center;justify-content:space-between;padding:0 19px;gap:16px}
.brand{display:flex;gap:14px;align-items:center;min-width:0;text-decoration:none}.brand-icon{width:19px;height:19px;border:2px solid var(--orange);transform:rotate(45deg);position:relative;flex:none}.brand-icon:after{content:"";position:absolute;inset:3px;border:1px solid var(--orange)}
.brand strong{display:block;font-size:17px;line-height:1.1;letter-spacing:-.5px}.brand strong em{font-style:normal;color:var(--orange)}.brand small{display:block;color:#a5b0be;font-size:9px;margin-top:2px}
.header-right{display:flex;align-items:center;gap:17px}.version{font-size:9px;color:#e7b37d;border:1px solid #563b29;border-radius:4px;background:#342720;padding:4px 7px}.demo-indicator{font-size:10px;color:var(--green);white-space:nowrap}.demo-indicator:before{content:"●";font-size:8px;margin-right:5px}.clock{text-align:right;min-width:105px}.clock strong{font-size:15px;display:block;line-height:1.2}.clock small{display:block;color:var(--muted);font-size:9px;margin-top:2px}
.shell{display:grid;grid-template-columns:178px minmax(0,1fr);min-height:calc(100vh - 62px)}
aside{background:var(--side);border-right:1px solid #303334;display:flex;flex-direction:column;position:sticky;top:62px;height:calc(100vh - 62px);min-height:0}
.sidebar-nav{padding:10px 8px;overflow:auto}.nav-item{width:100%;display:flex;align-items:center;text-align:left;gap:10px;min-height:35px;padding:0 10px;border:0;border-radius:5px;background:transparent;color:#d6dfeb;white-space:nowrap;font-size:11px}.nav-item:hover{background:#2b2d2e}.nav-item.active{background:#d97b24;color:white;font-weight:bold}.nav-icon{width:11px;text-align:center;flex:none;font-size:12px}
.side-bottom{margin-top:auto;border-top:1px solid #2e3031;padding:12px 8px;color:#9ca8b6;font-size:9px;line-height:1.5}.side-bottom b{display:block;font-size:11px;color:var(--orange);margin-bottom:2px}.side-bottom .return-link{display:block;margin-top:9px;color:#cbd4dd;text-decoration:none}.side-bottom .return-link:hover{text-decoration:underline}
main{padding:20px;min-width:0}.workspace{max-width:1340px}.page-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;min-height:44px}
h1{font-size:18px;line-height:1.25;margin:0 0 5px;font-weight:700;letter-spacing:-.2px}h2{font-size:13px;line-height:1.3;margin:0;font-weight:700}h3{font-size:12px;margin:0 0 7px}.subtitle{font-size:10px;color:var(--muted);margin:0}.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.btn{border:1px solid #464b4d;background:#2b2d2f;border-radius:5px;color:#e1eaf4;padding:8px 11px;font-size:10px;min-height:33px;white-space:nowrap}.btn:hover{background:#393c3e}.btn.primary{background:linear-gradient(#ec973d,#dd7e22);border-color:#bd741e;color:#171513;font-weight:bold}.btn.primary:hover{filter:brightness(1.1)}.btn.small{padding:5px 9px;min-height:28px}.btn.danger{color:#ffb3b3}.btn:disabled{opacity:.5;cursor:not-allowed}
.grid-four{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin-bottom:11px}.panel{background:var(--panel);border:1px solid var(--outline);border-radius:7px;padding:13px;min-width:0}.stat-panel{min-height:103px}.stat-label{color:#adbac9;font-size:10px;display:block;margin-bottom:9px}.stat-value{display:block;font-size:18px;line-height:1.25;font-weight:bold;margin-bottom:3px}.mini-desc{font-size:10px;color:var(--muted)}.online{color:var(--green)}.online:before{content:"●";font-size:8px;margin-right:3px}.offline{color:#eeac7f}.track{height:6px;border-radius:8px;background:#323637;overflow:hidden;margin:11px 0 3px}.track>span{display:block;height:100%;border-radius:8px;background:var(--orange)}.track.green>span{background:var(--green)}
.grid-two{display:grid;grid-template-columns:1.4fr 1fr;gap:11px}.overview-grid{margin-bottom:13px}.overview-grid .panel{min-height:188px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:11px}.count{font-size:10px;color:var(--muted);font-weight:bold}.empty{border:1px dashed #434748;border-radius:5px;min-height:82px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px;color:#a6b4c4}.empty strong{color:#edf0f3}.empty.large{min-height:180px}.panel-footer{margin-top:10px;display:flex;gap:7px;flex-wrap:wrap}.notice{padding:10px 11px;border:1px solid #5c4533;background:#292624;border-radius:5px;color:#edc4a9;font-size:10px;line-height:1.5}.section-status .notice{margin:11px 0 9px}.section-status{min-height:133px}.data-table{width:100%;border-collapse:collapse;font-size:11px}.data-table th{color:#a8b5c3;text-align:left;font-size:10px;font-weight:normal;padding:10px 9px;border-bottom:1px solid #404344}.data-table td{padding:11px 9px;border-bottom:1px solid #333637}.data-table tr:last-child td{border-bottom:none}.row-actions{display:flex;gap:7px;flex-wrap:wrap}.pill{display:inline-block;padding:3px 7px;border-radius:4px;color:#eab77b;background:#4a3121;font-size:10px}.pill.ok{background:#214132;color:#87e4b0}.pill.muted{background:#343637;color:#b3bcc6}.stack{display:grid;gap:11px}.detail-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin-bottom:11px}.kv{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid #3a3e40;padding:9px 0;color:#afbdca}.kv b{color:#ecf1f4;font-weight:600}.kv:last-child{border-bottom:0}.code-area{border:1px solid #454849;border-radius:5px;background:#17191a;color:#dae2e9;width:100%;min-height:130px;padding:12px;font:11px/1.5 Consolas,monospace;resize:vertical}.catalog{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.app-tile{display:flex;flex-direction:column;gap:8px;min-height:140px}.app-tile p{margin:0;color:#acb9c6;flex:1}.app-mark{color:var(--orange);font-size:18px}.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:5px}.log-row{border-bottom:1px solid #353839;padding:8px 0;font:11px Consolas,monospace;color:#b5c2cd}.log-row:last-child{border:0}.log-row span{color:#dc923f;margin-right:14px}.toolbar-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}.toolbar-row .btn{font-size:10px}
footer.demo-banner{margin-top:18px;color:#8b9aab;font-size:10px;padding-bottom:15px}.demo-banner strong{color:#f1b87c}
#toast{position:fixed;right:18px;bottom:19px;z-index:50;background:#303435;border:1px solid #bd772e;color:#f1f3f4;padding:11px 15px;max-width:370px;border-radius:6px;box-shadow:0 8px 30px #0008;font-size:11px}
#modal-backdrop{position:fixed;inset:0;background:#000b;z-index:40;display:flex;align-items:center;justify-content:center;padding:18px}.modal{background:#212425;border:1px solid #57504a;border-radius:9px;box-shadow:0 12px 50px #0009;max-width:520px;width:100%;max-height:calc(100vh - 36px);overflow:auto;padding:18px}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:10px}.modal h2{font-size:16px}.modal p{font-size:11px;color:#b9c6d2;line-height:1.6}.close{font-size:20px;color:#cad3dc;border:0;background:none;padding:0 4px;line-height:1}.field{display:grid;gap:5px;margin:12px 0}.field label{color:#c5d1df;font-size:11px}.field input,.field select,.field textarea{width:100%;background:#111617;border:1px solid #535858;border-radius:5px;padding:9px;color:#f4f6f7}.field textarea{min-height:90px;resize:vertical}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.info-text{font-size:10px;color:#9cadbd}.fake-link{border:0;background:none;padding:0;color:#e7a55f;text-decoration:underline}
[hidden]{display:none!important}
@media(max-width:1050px){.grid-four{grid-template-columns:repeat(2,minmax(0,1fr))}.catalog{grid-template-columns:repeat(2,minmax(0,1fr))}.overview-grid{grid-template-columns:1fr 1fr}.detail-grid{grid-template-columns:1fr 1fr}}
@media(max-width:760px){header{height:58px;padding:0 12px}.brand strong{font-size:15px}.clock{min-width:78px}.clock strong{font-size:12px}.header-right{gap:7px}.shell{grid-template-columns:53px minmax(0,1fr);min-height:calc(100vh - 58px)}aside{top:58px;height:calc(100vh - 58px)}.sidebar-nav{padding:7px 5px}.nav-item{padding:0;justify-content:center;min-height:39px}.nav-item .nav-text{display:none}.nav-icon{width:auto;font-size:17px}.side-bottom{padding:8px 4px;text-align:center}.side-bottom b,.side-bottom small{display:none}.side-bottom .return-link{font-size:9px}main{padding:12px}.page-heading{flex-wrap:wrap}.actions{justify-content:flex-start}.overview-grid{grid-template-columns:1fr}.grid-four,.detail-grid,.catalog{grid-template-columns:1fr 1fr}}
@media(max-width:460px){.clock small,.version{display:none}.grid-four,.detail-grid,.catalog{grid-template-columns:1fr}.panel{padding:11px}.stat-panel{min-height:83px}.page-heading{margin-bottom:10px}.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <a href="/demo/" class="brand" aria-label="SamyStack OS demo home"><span class="brand-icon" aria-hidden="true"></span><span><strong>Samy<em>Stack</em> OS</strong><small>Home infrastructure, one place</small></span></a>
  <div class="header-right"><span class="version">DEV 0.3</span><span class="demo-indicator">Demo / sample host</span><span class="clock"><strong id="clock-time">--:--:--</strong><small id="clock-date">Demo mode</small></span></div>
</header>
<div class="shell">
<aside>
 <nav class="sidebar-nav" id="nav" aria-label="SamyStack OS console pages">
  <button class="nav-item active" data-view="overview"><span class="nav-icon">⌂</span><span class="nav-text">Overview</span></button>
  <button class="nav-item" data-view="nodes"><span class="nav-icon">▦</span><span class="nav-text">Cluster Nodes</span></button>
  <button class="nav-item" data-view="vms"><span class="nav-icon">▣</span><span class="nav-text">Virtual Machines</span></button>
  <button class="nav-item" data-view="docker"><span class="nav-icon">⬡</span><span class="nav-text">Docker &amp; Compose</span></button>
  <button class="nav-item" data-view="apps"><span class="nav-icon">▤</span><span class="nav-text">App Catalog</span></button>
  <button class="nav-item" data-view="storage"><span class="nav-icon">▥</span><span class="nav-text">Storage &amp; Shares</span></button>
  <button class="nav-item" data-view="network"><span class="nav-icon">⌁</span><span class="nav-text">Network &amp; Routers</span></button>
  <button class="nav-item" data-view="dns"><span class="nav-icon">♧</span><span class="nav-text">DNS &amp; Ad Block</span></button>
  <button class="nav-item" data-view="backups"><span class="nav-icon">↶</span><span class="nav-text">Backups &amp; Restore</span></button>
  <button class="nav-item" data-view="esp32"><span class="nav-icon">⌘</span><span class="nav-text">ESP32 Devices</span></button>
  <button class="nav-item" data-view="ai"><span class="nav-icon">✧</span><span class="nav-text">AI Assistant</span></button>
  <button class="nav-item" data-view="system"><span class="nav-icon">⚙</span><span class="nav-text">System &amp; Logs</span></button>
 </nav>
 <div class="side-bottom"><b>SamyStack</b><small>Local Debian development host<br>Public interactive preview<br>No real infrastructure connected</small><a class="return-link" href="/">← Website</a></div>
</aside>
<main><div class="workspace" id="workspace" aria-live="polite"></div><footer class="demo-banner"><strong>PUBLIC DEMO</strong> — sample host data, browser-only actions. Nothing here connects to or changes a real server.</footer></main>
</div>
<div id="modal-backdrop" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title"></h2><button class="close" data-action="close" aria-label="Close dialog">×</button></div><div id="modal-body"></div></div></div>
<div id="toast" role="status" hidden></div>
<script>
(function(){
"use strict";
var navItems=[].slice.call(document.querySelectorAll("[data-view]"));
var workspace=document.getElementById("workspace"),backdrop=document.getElementById("modal-backdrop"),toast=document.getElementById("toast");
var views={overview:"Infrastructure Overview",nodes:"Cluster Nodes",vms:"Virtual Machines",docker:"Docker & Compose",apps:"App Catalog",storage:"Storage & Shares",network:"Network & Routers",dns:"DNS & Ad Block",backups:"Backups & Restore",esp32:"ESP32 Devices",ai:"AI Assistant",system:"System & Logs"};
var state={view:"overview",vms:[],containers:[],logs:[],selected:null};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function clock(){var now=new Date();document.getElementById("clock-time").textContent=now.toLocaleTimeString("en-US");document.getElementById("clock-date").textContent=now.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"})}
clock();setInterval(clock,1000);
function btn(text,action,variant){return '<button type="button" class="btn'+(variant?" "+variant:"")+'" data-action="'+esc(action)+'">'+esc(text)+'</button>'}
function linkBtn(text,view,variant){return '<button type="button" class="btn'+(variant?" "+variant:"")+'" data-go="'+view+'">'+esc(text)+'</button>'}
function wrap(title,subtitle,actions,body){return '<div class="page-heading"><div><h1>'+title+'</h1><p class="subtitle">'+subtitle+'</p></div><div class="actions">'+(actions||"")+'</div></div>'+body}
function panel(title,body,extra){return '<section class="panel"><div class="panel-head"><h2>'+title+'</h2><span class="count">'+(extra||"")+'</span></div>'+body+'</section>'}
function empty(heading,detail,large){return '<div class="empty'+(large?' large':'')+'"><strong>'+heading+'</strong><span>'+detail+'</span></div>'}
function over(){var vmCount=state.vms.length,ctCount=state.containers.length;
 var stats='<div class="grid-four">'+
 '<div class="panel stat-panel"><span class="stat-label">Host</span><span class="stat-value">SamyStack</span><span class="mini-desc online">Online (sample)</span><div class="mini-desc">0.3 development</div></div>'+
 '<div class="panel stat-panel"><span class="stat-label">Processor</span><span class="stat-value">4 cores</span><span class="mini-desc">1-minute load 0.00</span></div>'+
 '<div class="panel stat-panel"><span class="stat-label">Memory</span><span class="stat-value">0.4 GB / 7.7 GB</span><div class="track"><span style="width:6%"></span></div><span class="mini-desc">6% used</span></div>'+
 '<div class="panel stat-panel"><span class="stat-label">Root filesystem</span><span class="stat-value">66.6 GB free</span><div class="track green"><span style="width:91%"></span></div><span class="mini-desc">73.2 GB total</span></div>'+
 '</div>';
 var vms=panel("Virtual Machines",(vmCount?tableVM() : empty("No virtual machines yet.","Create one using a local ISO."))+'<div class="panel-footer">'+linkBtn("Open Virtual Machines","vms")+'</div>',vmCount+" detected");
 var cts=panel("Docker Containers",(ctCount?tableContainer() : empty("No containers deployed.","Use Deploy Container when Docker is installed."))+'<div class="panel-footer">'+linkBtn("Open Docker","docker")+'</div>',ctCount+" detected");
 var notice=panel("Cluster Development Status",'<div class="notice">This is one sample Debian development host. Other cluster nodes, shared storage, automatic controller failover, OpenWrt integration, and licensing are not configured. No fictional cluster nodes are displayed.</div><div class="panel-footer">'+linkBtn("View Cluster Nodes","nodes")+linkBtn("Network Status","network")+linkBtn("System Logs","system")+'</div>');
 return wrap("Infrastructure Overview","Local host · SamyStack · Sample development host (cluster not yet configured)",btn("+ Create VM","vm-create","primary")+btn("+ Deploy Container","container-create")+linkBtn("View Storage","storage"),stats+'<div class="grid-two overview-grid">'+vms+cts+'</div><section class="panel section-status"><h2>Cluster Development Status</h2><div class="notice">This is one sample Debian development host. Other cluster nodes, shared storage, automatic controller failover, OpenWrt integration, and licensing are not configured. No fictional nodes or workloads are displayed.</div><div class="panel-footer">'+linkBtn("View Cluster Nodes","nodes")+linkBtn("Network Status","network")+linkBtn("System Logs","system")+'</div></section>')}
function tableVM(){return '<div style="overflow:auto"><table class="data-table"><thead><tr><th>Name</th><th>vCPU</th><th>RAM</th><th>State</th><th>Actions</th></tr></thead><tbody>'+state.vms.map(function(vm,i){return '<tr><td>'+esc(vm.name)+'</td><td>'+vm.cores+'</td><td>'+vm.ram+' MB</td><td><span class="pill '+(vm.running?'ok':'muted')+'">'+(vm.running?'Running':'Stopped')+'</span></td><td><div class="row-actions">'+btn(vm.running?'Stop':'Start','vm-toggle:'+i,"small")+btn("Remove","vm-remove:"+i,"small danger")+'</div></td></tr>'}).join('')+'</tbody></table></div>'}
function tableContainer(){return '<div style="overflow:auto"><table class="data-table"><thead><tr><th>Name</th><th>Image</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+state.containers.map(function(c,i){return '<tr><td>'+esc(c.name)+'</td><td>'+esc(c.image)+'</td><td><span class="pill '+(c.running?'ok':'muted')+'">'+(c.running?'Running':'Stopped')+'</span></td><td><div class="row-actions">'+btn(c.running?'Stop':'Start','container-toggle:'+i,"small")+btn("Remove","container-remove:"+i,"small danger")+'</div></td></tr>'}).join('')+'</tbody></table></div>'}
function nodes(){return wrap("Cluster Nodes","Discovered hosts, membership and availability · sample host",btn("Discover Nodes","discover","primary")+btn("Join Cluster","join"),'<div class="grid-four"><div class="panel stat-panel"><span class="stat-label">Known hosts</span><span class="stat-value">1</span><span class="mini-desc">Local development host</span></div><div class="panel stat-panel"><span class="stat-label">Cluster</span><span class="stat-value">Not configured</span><span class="mini-desc">Standalone mode</span></div><div class="panel stat-panel"><span class="stat-label">Healthy nodes</span><span class="stat-value">1 / 1</span><span class="mini-desc">Simulated status</span></div><div class="panel stat-panel"><span class="stat-label">Failover</span><span class="stat-value">Unavailable</span><span class="mini-desc">Requires additional nodes</span></div></div>'+panel("Nodes",'<div style="overflow:auto"><table class="data-table"><thead><tr><th>Host</th><th>Role</th><th>CPU</th><th>Memory</th><th>Status</th></tr></thead><tbody><tr><td><strong>SamyStack</strong></td><td>Standalone</td><td>4 cores</td><td>7.7 GB</td><td><span class="pill ok">Online · sample</span></td></tr></tbody></table></div>')+'<div class="notice" style="margin-top:12px">Cluster joining and node discovery are represented as interface previews only. No local network is scanned from this website.</div>')}
function vms(){return wrap("Virtual Machines","KVM / QEMU management · browser-only simulation",btn("+ Create VM","vm-create","primary")+btn("ISO Library","iso"),panel("Virtual Machines",state.vms.length?tableVM():empty("No virtual machines yet.","The example host has no VMs. Use Create VM to explore the form.",true),state.vms.length+" detected")+'<div class="notice" style="margin-top:12px">Virtual machines created here exist only in this browser tab. They are not installed or started on a server.</div>')}
function docker(){return wrap("Docker & Compose","Containers, images and Compose stacks · browser-only simulation",btn("+ Deploy Container","container-create","primary")+btn("New Compose Stack","compose"),panel("Containers",state.containers.length?tableContainer():empty("No containers deployed.","Deploy a sample container to explore the controls.",true),state.containers.length+" detected")+'<section class="panel" style="margin-top:12px"><div class="panel-head"><h2>Compose Stacks</h2><span class="count">0 stacks</span></div>'+empty("No Compose stacks yet.","Use New Compose Stack to preview the editor.")+'</section>')}
var apps=[["Home Assistant","Home automation and device management"],["Jellyfin","Your own local media server"],["Pi-hole","Network-wide ad blocking"],["Grafana","Dashboards and infrastructure metrics"],["Nextcloud","Personal files, sync and collaboration"],["Open WebUI","Self-hosted AI chat interface"]];
function catalog(){return wrap("App Catalog","Browse deployment templates for a home server",btn("Refresh Catalog","refresh","primary"),'<div class="catalog">'+apps.map(function(app,i){return '<section class="panel app-tile"><div class="app-mark">▣</div><h2>'+esc(app[0])+'</h2><p>'+esc(app[1])+'</p>'+btn("View deployment","app:"+i,"small")+'</section>'}).join('')+'</div><p class="mini-desc" style="margin-top:12px">Catalog entries are previews; no applications install from the public demo.</p>')}
function storage(){return wrap("Storage & Shares","Volumes, filesystem capacity and network shares",btn("Create Share","share","primary")+btn("Add Storage","add-storage"),'<div class="grid-four"><div class="panel stat-panel"><span class="stat-label">Root filesystem</span><span class="stat-value">73.2 GB</span><span class="mini-desc">Sample capacity</span></div><div class="panel stat-panel"><span class="stat-label">Free</span><span class="stat-value">66.6 GB</span><span class="mini-desc">91% available</span></div><div class="panel stat-panel"><span class="stat-label">Shared storage</span><span class="stat-value">0</span><span class="mini-desc">No volumes configured</span></div><div class="panel stat-panel"><span class="stat-label">Network shares</span><span class="stat-value">0</span><span class="mini-desc">SMB / NFS</span></div></div>'+panel("Filesystems",'<div class="kv"><span>Root filesystem</span><b>66.6 GB free / 73.2 GB</b></div><div class="track green"><span style="width:91%"></span></div><span class="mini-desc">Illustrative host snapshot; not a live filesystem probe.</span>')+'<section class="panel" style="margin-top:11px">'+panelInner("Network Shares",empty("No shares configured.","Add a storage share on a connected installation."))+'</section>')}
function panelInner(title,body){return '<div class="panel-head"><h2>'+title+'</h2></div>'+body}
function network(){return wrap("Network & Routers","Interfaces, gateway and router integrations",btn("Scan Network","scan","primary")+btn("Add Router","router"),'<div class="detail-grid"><div class="panel"><span class="stat-label">Host network</span><span class="stat-value">Demo mode</span><span class="mini-desc">No real network connection</span></div><div class="panel"><span class="stat-label">Routers</span><span class="stat-value">0</span><span class="mini-desc">No managed routers</span></div><div class="panel"><span class="stat-label">OpenWrt</span><span class="stat-value">Not configured</span><span class="mini-desc">Integration planned</span></div></div>'+panel("Network Interfaces",empty("Network information unavailable in public demo.","The installed console can show local interfaces."))+'<div class="notice" style="margin-top:11px">This website does not request LAN access or enumerate devices on your network.</div>')}
function dns(){return wrap("DNS & Ad Block","DNS resolver and network-wide filtering controls",btn("Configure DNS","configure-dns","primary"),'<div class="detail-grid"><div class="panel"><span class="stat-label">DNS service</span><span class="stat-value">Not configured</span></div><div class="panel"><span class="stat-label">Blocked requests</span><span class="stat-value">—</span></div><div class="panel"><span class="stat-label">Connected clients</span><span class="stat-value">—</span></div></div>'+panel("DNS & Ad Block",empty("No DNS service configured.","Install or connect a DNS filtering service on your real host.",true)))}
function backups(){return wrap("Backups & Restore","Snapshots, backup jobs and restores",btn("Create Backup Job","backup-create","primary")+btn("Restore","restore"),'<div class="detail-grid"><div class="panel"><span class="stat-label">Backup Jobs</span><span class="stat-value">0</span></div><div class="panel"><span class="stat-label">Recent Backups</span><span class="stat-value">0</span></div><div class="panel"><span class="stat-label">Backup Targets</span><span class="stat-value">0</span></div></div>'+panel("Scheduled Jobs",empty("No backup jobs configured.","Create a backup schedule on an installed host.",true)))}
function esp32(){return wrap("ESP32 Devices","Pair, monitor and manage compatible microcontrollers",btn("+ Add Device","pair","primary")+btn("Discover","esp-discover"),'<div class="detail-grid"><div class="panel"><span class="stat-label">Registered devices</span><span class="stat-value">0</span></div><div class="panel"><span class="stat-label">Online devices</span><span class="stat-value">0</span></div><div class="panel"><span class="stat-label">Firmware updates</span><span class="stat-value">—</span></div></div>'+panel("Device Fleet",empty("No ESP32 devices paired.","Devices can be managed from a connected installation.",true)))}
function ai(){return wrap("AI Assistant","On-device models and automation",btn("Assistant Settings","ai-settings","primary"),'<div class="grid-two"><section class="panel"><div class="panel-head"><h2>AI Assistant</h2><span class="pill muted">Not configured</span></div>'+empty("No active model.","Connect a local model on a real installation.",true)+'</section><section class="panel"><div class="panel-head"><h2>Assistant Configuration</h2></div><div class="kv"><span>Inference backend</span><b>Not configured</b></div><div class="kv"><span>Active model</span><b>None</b></div><div class="kv"><span>Server tools</span><b>Unavailable in demo</b></div>'+btn("Explore Settings","ai-settings")+'</section></div>')}
function system(){return wrap("System & Logs","Host information, service health and activity",btn("Refresh","refresh","primary")+btn("View Host","nodes"),'<div class="detail-grid"><div class="panel"><span class="stat-label">Build</span><span class="stat-value">0.3</span><span class="mini-desc">Development preview</span></div><div class="panel"><span class="stat-label">Host</span><span class="stat-value">SamyStack</span><span class="mini-desc">Sample Debian host</span></div><div class="panel"><span class="stat-label">Web demo</span><span class="stat-value">Offline</span><span class="mini-desc">No backend connected</span></div></div>'+panel("Activity Log",'<div class="log-row"><span>DEMO</span>Loaded the public SamyStack OS console preview</div><div class="log-row"><span>STATUS</span>Backend connection disabled for public demonstration</div>'+state.logs.map(function(s){return '<div class="log-row"><span>LOCAL</span>'+esc(s)+'</div>'}).join('')))}
function render(){var view=views[state.view]?state.view:"overview";navItems.forEach(function(n){var active=n.dataset.view===view;n.classList.toggle("active",active);n.setAttribute("aria-current",active?"page":"false");n.title=views[n.dataset.view]});var out={overview:over,nodes:nodes,vms:vms,docker:docker,apps:catalog,storage:storage,network:network,dns:dns,backups:backups,esp32:esp32,ai:ai,system:system};workspace.innerHTML=out[view]();document.title=views[view]+" | SamyStack OS Demo"}
function go(view,push){if(!views[view])view="overview";state.view=view;if(push!==false)history.pushState(null,"","?view="+encodeURIComponent(view));render();window.scrollTo({top:0,behavior:"auto"})}
var startingView=new URLSearchParams(location.search).get("view");state.view=views[startingView]?startingView:"overview";render();
addEventListener("popstate",function(){var v=new URLSearchParams(location.search).get("view");go(v,false)});
function showToast(message){toast.textContent=message;toast.hidden=false;clearTimeout(showToast.timer);showToast.timer=setTimeout(function(){toast.hidden=true},5000)}
function close(){backdrop.hidden=true;document.getElementById("modal-body").innerHTML=""}
function modal(title,body){document.getElementById("modal-title").textContent=title;document.getElementById("modal-body").innerHTML=body;backdrop.hidden=false;var input=backdrop.querySelector("input");if(input)input.focus()}
function note(action){var labels={discover:"Node discovery",join:"Join Cluster",iso:"ISO Library",share:"Create Share","add-storage":"Add Storage",scan:"Network Scan",router:"Router Integration","configure-dns":"DNS Settings","backup-create":"Create Backup Job",restore:"Restore Backup",pair:"Pair ESP32 Device","esp-discover":"ESP32 Discovery","ai-settings":"Assistant Settings",refresh:"Refresh"};
modal(labels[action]||"Feature Preview",'<p>This control is part of the SamyStack OS interface. It requires a running server backend and is not connected in the public website demo.</p><div class="notice">No devices, files, services or networks will be changed.</div><div class="modal-actions">'+btn("Close","close","primary")+'</div>')}
function handleAction(action){
 if(action==="close"){close();return}
 if(action==="vm-create"){modal("Create Virtual Machine",'<p>Explore the VM setup form. Submitting creates a temporary browser-only example, not a real virtual machine.</p><form id="vm-form"><div class="field"><label for="vm-name">VM name</label><input id="vm-name" name="vm-name" maxlength="40" value="demo-vm" required></div><div class="form-grid"><div class="field"><label for="vm-cpu">CPU cores</label><select id="vm-cpu"><option>1</option><option selected>2</option><option>4</option></select></div><div class="field"><label for="vm-ram">Memory</label><select id="vm-ram"><option>512</option><option selected>2048</option><option>4096</option></select></div></div><div class="form-grid"><div class="field"><label for="vm-disk">Disk size</label><select id="vm-disk"><option>10 GB</option><option selected>20 GB</option><option>40 GB</option></select></div><div class="field"><label for="vm-iso">Installation ISO</label><select id="vm-iso"><option>None (demo only)</option></select></div></div><div class="notice">Browser-only simulation · no hypervisor is used</div><div class="modal-actions">'+btn("Cancel","close")+'<button class="btn primary" type="submit">Create sample VM</button></div></form>');return}
 if(action==="container-create"){modal("Deploy Container",'<p>Add a simulated container to explore the Docker interface. It does not pull images or execute code.</p><form id="container-form"><div class="field"><label for="container-name">Container name</label><input id="container-name" maxlength="40" value="demo-container" required></div><div class="field"><label for="container-image">Image</label><select id="container-image"><option>nginx:alpine</option><option>redis:alpine</option><option>hello-world:latest</option></select></div><div class="notice">Browser-only simulation · Docker is not contacted</div><div class="modal-actions">'+btn("Cancel","close")+'<button class="btn primary" type="submit">Deploy sample container</button></div></form>');return}
 if(action==="compose"){modal("New Compose Stack",'<p>Preview a Compose configuration. This editor does not run any containers.</p><div class="field"><label for="compose-text">compose.yaml</label><textarea id="compose-text" class="code-area" spellcheck="false">services:\n  web:\n    image: nginx:alpine\n    ports:\n      - "8080:80"</textarea></div><div class="modal-actions">'+btn("Close","close")+btn("Preview only","compose-preview","primary")+'</div>');return}
 if(action==="compose-preview"){showToast("Compose preview only. No containers were deployed.");close();return}
 if(action.indexOf("app:")===0){var idx=parseInt(action.split(":")[1],10);if(!apps[idx])return;modal(apps[idx][0],'<p>'+esc(apps[idx][1])+'.</p><div class="notice">A connected SamyStack OS installation would show deployment options here. The public demo cannot install this application.</div><div class="modal-actions">'+btn("Close","close")+btn("Preview deployment","app-preview","primary")+'</div>');return}
 if(action==="app-preview"){showToast("Application deployment preview only. No software was installed.");close();return}
 if(action.indexOf("vm-toggle:")===0){var i=parseInt(action.split(":")[1],10);if(!state.vms[i])return;state.vms[i].running=!state.vms[i].running;state.logs.push("Sample VM "+state.vms[i].name+" "+(state.vms[i].running?"started":"stopped"));render();return}
 if(action.indexOf("vm-remove:")===0){var i=parseInt(action.split(":")[1],10);if(!state.vms[i])return;state.logs.push("Sample VM "+state.vms[i].name+" removed");state.vms.splice(i,1);render();return}
 if(action.indexOf("container-toggle:")===0){var i=parseInt(action.split(":")[1],10);if(!state.containers[i])return;state.containers[i].running=!state.containers[i].running;render();return}
 if(action.indexOf("container-remove:")===0){var i=parseInt(action.split(":")[1],10);if(!state.containers[i])return;state.containers.splice(i,1);render();return}
 if(action==="refresh"){render();showToast("Refreshed browser-only sample data.");return}
 note(action)
}
document.addEventListener("click",function(e){var nav=e.target.closest("[data-view]");if(nav){go(nav.dataset.view);return}var route=e.target.closest("[data-go]");if(route){go(route.dataset.go);return}var action=e.target.closest("[data-action]");if(action){handleAction(action.dataset.action);return}if(e.target===backdrop)close()});
document.addEventListener("submit",function(e){if(e.target.id==="vm-form"){e.preventDefault();var name=document.getElementById("vm-name").value.trim();if(!name)return;state.vms.push({name:name,cores:document.getElementById("vm-cpu").value,ram:document.getElementById("vm-ram").value,running:false});state.logs.push("Sample VM "+name+" created");close();go("vms");showToast("Sample VM added to browser session only.");return}if(e.target.id==="container-form"){e.preventDefault();var name=document.getElementById("container-name").value.trim();if(!name)return;state.containers.push({name:name,image:document.getElementById("container-image").value,running:true});state.logs.push("Sample container "+name+" added");close();go("docker");showToast("Sample container added to browser session only.");return}});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!backdrop.hidden)close()});
})();
</script>
</body>
</html>
